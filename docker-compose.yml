services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: niramay
      POSTGRES_USER: niramay
      POSTGRES_PASSWORD: niramay_demo_password
    ports:
      - "5432:5432"
    volumes:
      - niramay_pgdata:/var/lib/postgresql/data
volumes:
  niramay_pgdata:
